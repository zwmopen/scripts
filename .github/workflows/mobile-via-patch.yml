name: Apply mobile Via ZIP patch

on:
  push:
    branches: [mobile-via-zip]
    paths:
      - '.github/workflows/mobile-via-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-via-zip
          fetch-depth: 0
      - name: Apply patch with RED-GREEN verification
        run: python maintenance/apply-mobile-via-zip.py
      - name: Show resulting diff
        run: git diff --check && git status --short && git diff --stat
      - name: Commit verified mobile build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-tree.user.js tests/test_mobile_zip_userscript.py
          git commit -m "feat(mobile): add Via ZIP packaging with required copy"
          git push origin HEAD:mobile-via-zip
