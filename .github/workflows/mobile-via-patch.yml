name: Apply mobile Via runtime patch

on:
  push:
    branches: [mobile-via-zip]
    paths:
      - '.github/workflows/mobile-via-patch.yml'
      - 'maintenance/apply-mobile-via-runtime-fix.py'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: mobile-via-zip
          fetch-depth: 0
      - name: Normalize runtime patch inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('chatgpt-conversation-tree.user.js')
          text = source.read_text(encoding='utf-8')
          text, count = re.subn(
              r'^[ \t]*const MOBILE_SWIPE_EDGE_PX\s*=\s*34;[ \t]*$',
              '  const MOBILE_SWIPE_EDGE_PX = 34;',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit(f'Expected one MOBILE_SWIPE_EDGE_PX=34 anchor, got {count}')
          source.write_text(text, encoding='utf-8')

          patch = Path('maintenance/apply-mobile-via-runtime-fix.py')
          patch_text = patch.read_text(encoding='utf-8')
          if 'self.assertIn("screen.width", section)' not in patch_text:
              raise SystemExit('Expected old screen.width assertion in runtime patch')
          patch_text = patch_text.replace(
              'self.assertIn("screen.width", section)',
              'self.assertIn("screen?.width", section)',
              1,
          )
          patch.write_text(patch_text, encoding='utf-8')
          PY
      - name: Apply Via runtime patch with RED-GREEN verification
        run: python maintenance/apply-mobile-via-runtime-fix.py
      - name: Verify mobile build
        run: |
          python tests/test_mobile_via_runtime.py
          python tests/test_mobile_zip_userscript.py
          python tests/test_mobile_sidebar_swipe.py
          node --check chatgpt-conversation-tree.user.js
          git diff --check
          git status --short
          git diff --stat
      - name: Commit verified mobile build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt-conversation-tree.user.js tests/test_mobile_via_runtime.py
          git commit -m "fix(mobile): make Via ZIP button and sidebar gestures reliable"
          git push origin HEAD:mobile-via-zip
