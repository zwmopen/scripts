name: CodexRadar model monitor

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/codexradar-monitor.yml"
      - "tools/codexradar-monitor/**"
  pull_request:
    paths:
      - ".github/workflows/codexradar-monitor.yml"
      - "tools/codexradar-monitor/**"
  schedule:
    # GitHub cron uses UTC. These correspond to 09:10, 15:10 and 18:10 in Asia/Shanghai.
    - cron: "10 1,7,10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codexradar-model-monitor-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run parser tests
        run: python3 tools/codexradar-monitor/test_monitor.py

  monitor:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write

    env:
      CODEXRADAR_ISSUE_NUMBER: "9"
      CODEXRADAR_MENTION: "zwmopen"
      CODEXRADAR_NOTIFICATION_PATH: ${{ runner.temp }}/codexradar-notification.md
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Fetch and rank current models
        run: python3 tools/codexradar-monitor/monitor.py

      - name: Comment when the recommendation changes
        shell: bash
        run: |
          if [[ -s "$CODEXRADAR_NOTIFICATION_PATH" ]]; then
            gh issue comment "$CODEXRADAR_ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$CODEXRADAR_NOTIFICATION_PATH"
          else
            echo "Recommendation unchanged; no Issue comment needed."
          fi

      - name: Commit new radar snapshot
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/codexradar)" ]]; then
            echo "No new CodexRadar dataset to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/codexradar
          git commit -m "data: update CodexRadar snapshot"
          git push
