name: Repository quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bounded-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Check JavaScript syntax
        run: node --check chatgpt-conversation-tree.user.js

      - name: Verify userscript version contract
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('chatgpt-conversation-tree.user.js').read_text(encoding='utf-8-sig')
          metadata = re.search(r'^//\s*@version\s+([^\s]+)', text, re.MULTILINE)
          runtime = re.search(r"const\s+SCRIPT_VERSION\s*=\s*['\"]([^'\"]+)['\"]", text)
          if not metadata or not runtime:
              raise SystemExit('Cannot locate userscript metadata version and SCRIPT_VERSION')
          if metadata.group(1) != runtime.group(1):
              raise SystemExit(f'Version mismatch: metadata={metadata.group(1)} runtime={runtime.group(1)}')
          required_contracts = [
              'restorePreviousCloudPrompts',
              'suspiciousShrink',
              'HARD_NAVIGATION_FALLBACK_KEY',
              'if (document.hidden) return;',
          ]
          missing = [item for item in required_contracts if item not in text]
          if missing:
              raise SystemExit(f'Missing ChatGPT helper safety contracts: {missing}')
          if '// @connect      *' in text:
              raise SystemExit('Userscript must not request unrestricted @connect permission')
          PY

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path . -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PowerShell syntax errors in $($_.FullName)"
              $errors | ForEach-Object { Write-Host $_.Message }
            }
          }
          if ($failed) { exit 1 }

      - name: Check Python syntax and transaction tests
        run: |
          python -m py_compile "本地文件处理脚本/素材处理脚本/安装-一键生成硬链接封面.py"
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify destructive-operation safety contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          files = {
              'work package': Path('本地文件处理脚本/一键GPT作品包/make_work_package.ps1').read_text(encoding='utf-8-sig'),
              'sync': Path('本地文件处理脚本/素材处理脚本/同步-硬链接素材工作副本.ps1').read_text(encoding='utf-8-sig'),
              'rename': Path('本地文件处理脚本/素材处理脚本/评论在前改名工具/swap-like-comment-prefix.ps1').read_text(encoding='utf-8-sig'),
              'installer': Path('本地文件处理脚本/素材处理脚本/安装-一键生成硬链接封面.py').read_text(encoding='utf-8-sig'),
          }
          required = {
              'work package': ['[switch]$Preview', 'Restore-StagedImages', 'Move-DuplicateDownloadImagesToQuarantine', '$packageCommitted'],
              'sync': ['ValidateSet("Preview", "Apply", "Undo")', 'ConfirmReplaceToken', 'ConfirmUndoToken', '.sync-history', 'TestFailAfterBackup'],
              'rename': ['ValidateSet("Preview", "Apply", "Undo")', 'ConfirmApplyToken', 'ConfirmUndoToken', 'Invoke-RenameTransaction'],
              'installer': ['--apply', '.preview-hardlink-staging-', '.preview-hardlink-backup-', 'HARDLINK_TEST_FAIL_AFTER'],
          }
          forbidden = {
              'work package': ['function Remove-DuplicateDownloadImages'],
              'rename': ['[switch]$Preview'],
              'installer': ['clear_preview_files(preview_dir)'],
          }
          for label, markers in required.items():
              for marker in markers:
                  if marker not in files[label]:
                      raise SystemExit(f'{label}: missing safety marker {marker}')
          for label, markers in forbidden.items():
              for marker in markers:
                  if marker in files[label]:
                      raise SystemExit(f'{label}: forbidden unsafe marker remains: {marker}')
          PY

      - name: Check JSON and work package config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              if '.git' in path.parts:
                  continue
              with path.open('r', encoding='utf-8-sig') as fh:
                  data = json.load(fh)
              if path.name == 'workpkg_config.json':
                  required = {
                      'library_name', 'portfolio_auto_group', 'portfolio_auto_zip',
                      'portfolio_batch_size', 'portfolio_prefix', 'portfolio_log_folder',
                  }
                  missing = required - set(data)
                  if missing:
                      raise SystemExit(f'{path}: missing keys {sorted(missing)}')
                  if not isinstance(data['portfolio_batch_size'], int) or data['portfolio_batch_size'] < 1:
                      raise SystemExit(f'{path}: portfolio_batch_size must be a positive integer')
          PY

      - name: Check whitespace errors
        run: git diff --check

      - name: Reject tracked files larger than 50 MB
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          limit = 50 * 1024 * 1024
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          large = []
          for item in filter(None, files):
              path = Path(item)
              if path.is_file() and path.stat().st_size > limit:
                  large.append(f'{item} ({path.stat().st_size} bytes)')
          if large:
              raise SystemExit('Files larger than 50 MB are not allowed:\n' + '\n'.join(large))
          PY

  windows-behavior:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Run destructive-operation rollback tests
        id: behavior
        continue-on-error: true
        shell: pwsh
        run: |
          ./tests/script-safety.tests.ps1 *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\script-safety-windows.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload failed Windows behavior log
        if: steps.behavior.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: script-safety-windows-${{ github.run_id }}
          path: ${{ runner.temp }}/script-safety-windows.log
          retention-days: 3
          if-no-files-found: error

      - name: Stop after Windows behavior failure
        if: steps.behavior.outcome == 'failure'
        run: exit 1
